[discovery]
# Whether to exclude hidden directories (starting with '.')
exclude_hidden_dirs = true

# Directories to exclude from module discovery (comma-separated)
excluded_dirs = 

# File patterns to include (comma-separated)
# Only files matching these patterns will be considered as Python modules
included_file_patterns = *.py

# Whether to include __init__.py files
include_init_files = true

# Max depth for module discovery (-1 for unlimited)
max_discovery_depth = -1

# Whether to follow symbolic links during discovery
follow_symlinks = false

[type_check]
# Whether to perform runtime type checking
enabled = true

# Whether to check return values
check_return_values = true

# Whether to check function arguments
check_arguments = true

# Whether to raise exceptions on type mismatch (False = just log)
strict = true

# Whether to show warnings for annotation differences
show_annotation_warnings = true

[import]
# Maximum number of modules to import at once
max_modules = 100

# Time limit for module imports in seconds
import_timeout = 10

# Whether to show import warnings
show_import_warnings = true

[logging]
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = DEBUG

# Whether to log to file
file = true

# output file for logging
filename = log.txt

[error_handling]
# Continue validation when errors occur
continue_on_error = true

# Continue when import errors occur
continue_on_import_error = true

# Show detailed error messages
show_detailed_errors = true

# Include suggestions in error messages
include_suggestions = true

# Maximum error context depth
max_error_context_depth = 5

[files]
# Python file extension
python_extension = .py

# Python package init filename
init_filename = __init__.py

# Default configuration file name
config_default = defaults.conf

# Custom configuration file name
config_custom = custom_config.conf

[performance]
# Default timeout for operations in seconds
default_timeout = 30

[memory]
# Memory optimization settings
# Enable memory cleanup features
cleanup_enabled = true

# Enable lazy module loading
lazy_loading = true

# Maximum number of validation results to keep in memory
max_validation_results = 10000

# Minimum usage count for module cleanup (modules with <= this usage may be removed)
min_module_usage = 0

# Maximum age in hours for unused modules before cleanup
max_module_age_hours = 24.0

# Enable automatic cleanup during operation
auto_cleanup = true

# Cleanup interval in number of validation results
cleanup_interval = 1000

[reporting]
# Maximum string representation length for error reporting
max_string_representation = 100

# Error detail level (full, basic, minimal)
error_detail_level = full

# Whether to include traceback in error reports
include_traceback = false

# Output formats (comma-separated)
output_formats = json

[report]
# JSON report schema version (v2 only)
schema_version = 2
warnings_as_fail = false
include_config_snapshot = false
max_evidence_items_text = 3
multi_target_exit_policy = any_fail
fail_threshold = 1

[projects]
# Source path for reference modules (used in multi-target runs)
source_path = .

# Explicit target list (comma-separated)
targets =

# Target path for projects (can be single path or directory)
target_path = ./target

# Directory containing target projects (each subdir is a target)
targets_dir =

# Pattern for project discovery
project_pattern = *

# Patterns to exclude from discovery
exclude_patterns = .git,__pycache__,template

# Required modules for each project
required_modules = calculator,data_processor

[matching]
threshold = 0.80
delta = 0.03
min_candidate = 0.50
top_n = 5
max_fuzzy_candidates = 5
max_stage2_candidates = 0
max_stage3_candidates = 0
include_nested_functions = false
