[discovery]
# Whether to exclude hidden directories (starting with '.')
exclude_hidden_dirs = true

# Directories to exclude from module discovery (comma-separated)
excluded_dirs = __pycache__, .git, .venv, venv

# File patterns to include (comma-separated)
# Only files matching these patterns will be considered as Python modules
included_file_patterns = *.py

# Whether to include __init__.py files
include_init_files = true

# Max depth for module discovery (-1 for unlimited)
max_discovery_depth = -1

# Whether to follow symbolic links during discovery
follow_symlinks = false

[logging]
# Log level (DEBUG, INFO, WARNING, ERROR, CRITICAL)
level = WARNING

# Whether to log to file in addition to stderr
file = false

# output file for logging
filename = log.txt

# Deprecated alias for logging filename; use `null` for no explicit alias
output_file = null

[report]
# JSON report schema version (v2 only)
schema_version = 2
validate_schema_v2 = false
warnings_as_fail = false
include_config_snapshot = false
max_evidence_items_text = 3
run_exit_policy = any_fail
fail_threshold = 1

# Detail level for markdown reports (summary, verbose, debug).
# - summary: metadata, summary counts, results table
# - verbose: + matching summary section (default)
# - debug:   + per-entity matching candidates breakdown (also available in JSON)
markdown_detail = verbose

[projects]
# Source path for reference modules (used in run execution)
source_path = .

# Explicit target list (comma-separated)
targets =

# Target path for projects (can be single path or directory)
target_path =

# Directory containing target projects (each subdir is a target)
targets_dir =

# Pattern for project discovery
project_pattern = *

# Patterns to exclude from discovery
exclude_patterns = .git,__pycache__,template

[matching]
threshold = 0.80
delta = 0.03
min_candidate = 0.50
top_n = 5
max_fuzzy_candidates = 5
max_stage2_candidates = 0
max_stage3_candidates = 0
# Pair by name what the scores leave unpaired: the only target entity of an
# unpaired reference entity's kind and name, then the same-named methods of
# a paired class (signatures checked, matches never replaced).
name_fallback = true
include_nested_functions = false
