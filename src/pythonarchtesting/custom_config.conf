# Deprecated compatibility sample. Rename this file to
# python_arch_testing.conf to use the canonical auto-discovery filename.
#
[discovery]
# Override excluded directories - this will replace the defaults
excluded_dirs = __pycache__, .git, node_modules

# Override file patterns - only Python files ending with _test.py
included_file_patterns = *.py

[import]
# Increase the maximum number of modules allowed to import 
max_modules = 200

# Set a longer timeout
import_timeout = 30 
