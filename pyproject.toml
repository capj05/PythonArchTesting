[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonarchtesting"
version = "0.1.0"
description = "A toolkit for testing and enforcing architectural constraints in Python projects"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "capj05", email = "capj05@vse.cz"}
]
keywords = ["architecture", "testing", "validation", "python"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
# Upper bounds are deliberate: the formatting and typing gates are not stable
# across major versions of these tools. isort 7 and isort 9 disagree on
# parenthesized single-name imports, and mypy changed which casts it considers
# redundant. Without a ceiling, `pip install .[dev]` silently changes what the
# quality gates accept.
mcp = [
    "mcp>=2.3,<3",
]
# The baseline of the architectural-mutant evaluation
# (example/architectural_mutants/baselines/importlinter.py).
eval = [
    "import-linter>=2.15,<3",
]
dev = [
    "mcp>=2.3,<3",
    "pytest>=7.4.0,<10",
    "pytest-cov>=4.1.0,<8",
    "pytest-xdist>=3.3.1,<4",
    "pytest-mock>=3.11.1,<4",
    "hypothesis>=6.0.0,<7",
    "psutil>=5.9.0,<8",
    "black>=26.1,<27",
    "isort>=9,<10",
    "mypy>=1.19,<3",
    "flake8>=6.0.0,<8",
    "flake8-pyproject>=1.2.0,<2",
    "pylint>=2.17.5,<5",
    "bandit>=1.7.5,<2",
    "safety>=2.3.5",
    "radon>=6.0.1,<7",
    "vulture>=2.7,<3",
    "pre-commit>=3.3.3,<5",
    "sphinx>=7.1.2,<10",
    "sphinx-rtd-theme>=1.3.0,<4",
    "types-requests>=2.31.0",
    "types-setuptools>=68.0.0",
]

[project.urls]
Homepage = "https://github.com/capj05/PythonArchTesting"
Documentation = "https://github.com/capj05/PythonArchTesting/tree/main/docs"
Repository = "https://github.com/capj05/PythonArchTesting.git"
"Bug Tracker" = "https://github.com/capj05/PythonArchTesting/issues"

[project.scripts]
python-arch-test = "pythonarchtesting.cli:main"
python-arch-test-mcp = "pythonarchtesting.mcp_server.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

# The marker docs stay the only copy; the MCP server reads them from here
# when it is not run from a checkout.
[tool.setuptools.data-files]
"share/pythonarchtesting/markers" = ["docs/markers/*.md"]

[tool.setuptools.package-data]
pythonarchtesting = ["*.conf"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pythonarchtesting*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--cov=pythonarchtesting",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "unit: mark test as a unit test",
    "integration: mark test as an integration test",
    "performance: mark test as a performance test",
    "property: mark test as a property-based test",
    "slow: mark test as slow running",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning:asyncio",
]

[tool.coverage.run]
source = ["pythonarchtesting"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["pythonarchtesting"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pylint.design]
# Ceilings reflecting the code as it stands today, not an endorsement. The worst
# offenders are compile_does_not_have() at 34 branches and the api_signature
# evaluators at 113 statements. Lower these as those functions are split, rather
# than raising them for new code.
max-branches = 35
max-statements = 115

[tool.flake8]
max-line-length = 100
max-complexity = 50
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    "*.egg-info",
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
]
