principle = "encapsulation"

[roles]
owner = ["inventory.Inventory"]
client = ["shop.sell", "shop.restock", "shop.clear_out", "shop.report"]

[cases]
"shop.sell" = [
  {args = [{"$new" = "inventory.Inventory", args = [{jablko = 5, hruska = 2}]}, "jablko", 2]},
  {args = [{"$new" = "inventory.Inventory", args = [{jablko = 5}]}, "jablko", 9]},
]
"shop.restock" = [
  {args = [{"$new" = "inventory.Inventory", args = [{jablko = 1}]}, {jablko = 3, hruska = 4}]},
  {args = [{"$new" = "inventory.Inventory", args = [{jablko = 1}]}, {jablko = 0}]},
]
"shop.clear_out" = [
  {args = [{"$new" = "inventory.Inventory", args = [{jablko = 5, hruska = 2}]}, "jablko"]},
  {args = [{"$new" = "inventory.Inventory", args = [{jablko = 5}]}, "hruska"]},
]
"shop.report" = [
  {args = [{"$new" = "inventory.Inventory", args = [{jablko = 5, hruska = 2}]}]},
]
