[logging]
file_path = ./architecture_validation.log
level = DEBUG
console_output = true

[discovery]
excluded_dirs = __pycache__, .git, .venv, .pytest_cache
included_file_patterns = *.py

[type_check]
enabled = true
strict = true
check_return = true

[validation]
compare_implementations = true
check_method_signatures = true
validate_error_handling = true
