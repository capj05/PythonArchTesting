[discovery]
exclude_hidden_dirs = true
excluded_dirs = .git, node_modules, __pycache__
included_file_patterns = *.py, *.pyw

[type_check]
enabled = true
check_return_values = true
check_arguments = true
strict = false
show_annotation_warnings = true

[import]
max_modules = 200
import_timeout = 15.5
show_import_warnings = true

[logging]
level = DEBUG
console = true
file = true
file_path = test_log.log 